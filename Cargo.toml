[package]
name = "larry"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Execute commands and capture their output as structured, labeled sections"
license = "BSD-0-Clause"
repository = "https://github.com/hashbangcore/larry"
readme = "README.md"
keywords = ["cli", "observability", "pipeline", "shell", "diagnostics"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
thiserror = "2.0"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
must_use_candidate = "warn"
assert_is_empty = "warn"
redundant_clone = "warn"
doc_markdown = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
